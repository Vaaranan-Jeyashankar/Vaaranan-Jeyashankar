<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Vaaranan J — Cybersecurity Enthusiast</title>
<desc id="d">Cyberpunk command-center banner with a holographic AI robot head, the name Vaaranan J, the title Cybersecurity Enthusiast and a decorative System Online indicator.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03060B"/><stop offset="1" stop-color="#071A2E"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset=".6" stop-color="#7C4DFF"/><stop offset="1" stop-color="#FF1744"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00E5FF" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".35"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#grid)"/>
<g fill="none" stroke="#00E5FF" stroke-opacity=".25"><path d="M0 360h120l30-30h200"/><path d="M1200 60h-140l-30 30H860"/><circle cx="350" cy="330" r="3" fill="#00E5FF"/><circle cx="860" cy="90" r="3" fill="#FF1744"/></g>
<g fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"><path d="M20 60V20h60"/><path d="M1180 60V20h-60"/><path d="M20 360v40h60"/><path d="M1180 360v40h-60"/></g>
<g transform="translate(920 210)">
 <circle r="170" fill="none" stroke="#00E5FF" stroke-opacity=".25" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
 <circle r="145" fill="none" stroke="#FF1744" stroke-opacity=".5" stroke-width="2" stroke-dasharray="80 40 10 40"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/></circle>
 <circle r="120" fill="#00E5FF" fill-opacity=".04" stroke="#00E5FF" stroke-opacity=".4"/>
 <g filter="url(#glow)">
  <path d="M-70 -40Q-70-110 0-110T70-40V30Q70 80 0 95Q-70 80-70 30Z" fill="#071A2E" stroke="#00E5FF" stroke-width="2.5"/>
  <path d="M-55-10H55V18Q0 34-55 18Z" fill="#03060B" stroke="#FF1744" stroke-width="2"/>
  <rect x="-42" y="-2" width="30" height="8" rx="4" fill="#FF1744"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></rect>
  <rect x="12" y="-2" width="30" height="8" rx="4" fill="#FF1744"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></rect>
  <path d="M-30 50h60M-22 62h44" stroke="#00E5FF" stroke-width="2"/>
  <path d="M0-110V-80M-70-30h-22v40h22M70-30h22v40H70" fill="none" stroke="#00E5FF" stroke-width="2"/>
  <circle cy="-116" r="5" fill="#00E5FF"/>
 </g>
</g>
<text x="80" y="110" fill="#00E5FF" font-family="Consolas,Menlo,monospace" font-size="16" letter-spacing="6">// SECURITY COMMAND CENTER</text>
<text x="78" y="200" fill="url(#nm)" font-family="Orbitron,'Segoe UI',Arial,sans-serif" font-weight="800" font-size="84" letter-spacing="4" filter="url(#glow)">VAARANAN J</text>
<text x="80" y="248" fill="#E6F7FF" font-family="Consolas,Menlo,monospace" font-size="24" letter-spacing="8">CYBERSECURITY ENTHUSIAST</text>
<text x="80" y="290" fill="#8FB3C9" font-family="'Segoe UI',Arial,sans-serif" font-size="17">Aspiring SOC Analyst · Blue Team · Network Defense</text>
<g transform="translate(80 330)"><rect width="190" height="34" rx="4" fill="#03060B" stroke="#00E5FF" stroke-opacity=".6"/><circle cx="20" cy="17" r="6" fill="#00E676"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="36" y="22" fill="#00E676" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="3">SYSTEM ONLINE</text></g>
<text x="290" y="352" fill="#5A7A90" font-family="Consolas,Menlo,monospace" font-size="11">[decorative indicator]</text>
<rect width="1200" height="420" fill="url(#scan)"/>
<rect width="1200" height="3" fill="#00E5FF" opacity=".18"><animate attributeName="y" values="0;420" dur="6s" repeatCount="indefinite"/></rect>
</svg>
