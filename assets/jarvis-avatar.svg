<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d">
<title id="t">AI assistant avatar</title>
<desc id="d">Decorative holographic AI assistant with a waveform and a greeting speech bubble. It is artwork only and not a functional assistant.</desc>
<defs><filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="core"><stop offset="0" stop-color="#00E5FF" stop-opacity=".9"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient></defs>
<rect width="900" height="340" rx="16" fill="#03060B" stroke="#00E5FF" stroke-opacity=".35"/>
<g transform="translate(170 170)" filter="url(#g)">
 <circle r="135" fill="none" stroke="#00E5FF" stroke-opacity=".3" stroke-dasharray="2 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle>
 <circle r="110" fill="none" stroke="#FF1744" stroke-width="3" stroke-dasharray="60 30"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/></circle>
 <circle r="85" fill="none" stroke="#7C4DFF" stroke-opacity=".6"/>
 <circle r="60" fill="url(#core)"><animate attributeName="r" values="52;64;52" dur="2.4s" repeatCount="indefinite"/></circle>
 <path d="M-34-26Q0-56 34-26V18Q0 40-34 18Z" fill="#071A2E" stroke="#00E5FF" stroke-width="2"/>
 <rect x="-24" y="-8" width="18" height="6" rx="3" fill="#FF1744"/><rect x="6" y="-8" width="18" height="6" rx="3" fill="#FF1744"/>
</g>
<g transform="translate(350 60)">
 <path d="M0 0H500V120H40L10 150V120H0Z" fill="#071A2E" stroke="#00E5FF" stroke-opacity=".7"/>
 <text x="24" y="40" fill="#00E5FF" font-family="Consolas,Menlo,monospace" font-size="14" letter-spacing="3">ASSISTANT // READY</text>
 <text x="24" y="74" fill="#E6F7FF" font-family="'Segoe UI',Arial,sans-serif" font-size="20">Hello, operator. Welcome to Vaaranan's</text>
 <text x="24" y="100" fill="#E6F7FF" font-family="'Segoe UI',Arial,sans-serif" font-size="20">security command center.</text>
</g>
<g transform="translate(360 250)" stroke="#00E5FF" stroke-width="4" stroke-linecap="round">
 <line x1="0" y1="-10" x2="0" y2="10"><animate attributeName="y1" values="-10;-28;-10" dur="1s" repeatCount="indefinite"/></line>
 <line x1="20" y1="-18" x2="20" y2="18"><animate attributeName="y1" values="-18;-6;-18" dur=".8s" repeatCount="indefinite"/></line>
 <line x1="40" y1="-26" x2="40" y2="26"><animate attributeName="y1" values="-26;-12;-26" dur="1.2s" repeatCount="indefinite"/></line>
 <line x1="60" y1="-14" x2="60" y2="14"><animate attributeName="y1" values="-14;-30;-14" dur=".9s" repeatCount="indefinite"/></line>
 <line x1="80" y1="-22" x2="80" y2="22" stroke="#FF1744"><animate attributeName="y1" values="-22;-8;-22" dur="1.1s" repeatCount="indefinite"/></line>
 <line x1="100" y1="-8" x2="100" y2="8"><animate attributeName="y1" values="-8;-24;-8" dur=".7s" repeatCount="indefinite"/></line>
 <line x1="120" y1="-16" x2="120" y2="16"/>
</g>
<text x="520" y="245" fill="#8FB3C9" font-family="Consolas,Menlo,monospace" font-size="13">VOICE ......... STANDBY</text>
<text x="520" y="268" fill="#8FB3C9" font-family="Consolas,Menlo,monospace" font-size="13">HOLO CORE ..... ONLINE</text>
<text x="520" y="300" fill="#5A7A90" font-family="Consolas,Menlo,monospace" font-size="11">[decorative status — not a live system]</text>
</svg>
