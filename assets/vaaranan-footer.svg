<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Vaaranan footer banner</title>
  <desc id="desc">Minimal burgundy footer with a subtle telemetry line and closing cybersecurity phrase.</desc>
  <defs>
    <linearGradient id="bgGradientFooter" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="signalGradientFooter" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#C77B9B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#701A3D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="softGlowFooter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="180" fill="url(#bgGradientFooter)"/>
  <g opacity="0.18" fill="none" stroke="#E5B5C7" stroke-width="1">
    <path d="M 35 60 H 1165"/>
    <path d="M 35 120 H 1165"/>
  </g>
  <g fill="none" stroke="url(#signalGradientFooter)" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlowFooter)">
    <path d="M 50 90 C 180 90, 220 60, 330 90 S 520 120, 670 90 S 940 70, 1150 90">
      <animate attributeName="stroke-dasharray" values="0 1200; 420 780; 0 1200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-150;-300" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="54" font-size="18" font-weight="600" letter-spacing="4" fill="#E5B5C7">SECURING SYSTEMS</text>
    <text x="600" y="95" font-size="36" font-weight="700" letter-spacing="1.5">Investigating threats. Building resilient networks.</text>
  </g>
</svg>
