<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Vaaranan J cybersecurity hero banner</title>
  <desc id="desc">Dark burgundy cybersecurity banner with network telemetry, animated gradients, and security-like geometric accents.</desc>
  <defs>
    <linearGradient id="bgGradientHero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="45%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="glowGradientHero" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#701A3D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signalGradientHero" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#C77B9B" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softGlowHero" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="gridHero" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E5B5C7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <mask id="scanMaskHero">
      <rect width="1200" height="420" fill="black"/>
      <rect x="0" y="250" width="1200" height="170" fill="url(#scanFadeHero)"/>
    </mask>
    <linearGradient id="scanFadeHero" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGradientHero)"/>
  <rect width="1200" height="420" fill="url(#glowGradientHero)"/>
  <rect width="1200" height="420" fill="url(#gridHero)" opacity="0.9"/>

  <g opacity="0.9" stroke="#E5B5C7" stroke-opacity="0.12" fill="none">
    <path d="M 130 340 L 350 340" stroke-width="1"/>
    <path d="M 760 90 L 1090 90" stroke-width="1"/>
    <path d="M 820 300 L 1100 300" stroke-width="1"/>
  </g>

  <g opacity="0.8" fill="#E5B5C7" fill-opacity="0.75">
    <circle cx="290" cy="110" r="4"/>
    <circle cx="555" cy="150" r="4"/>
    <circle cx="760" cy="260" r="4"/>
    <circle cx="980" cy="165" r="4"/>
    <circle cx="1060" cy="95" r="4"/>
  </g>

  <g fill="none" stroke="url(#signalGradientHero)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlowHero)">
    <path d="M 0 250 C 80 230, 120 260, 180 220 S 320 160, 415 200 S 560 250, 630 180 S 760 90, 840 150 S 995 225, 1200 100" stroke-width="3" opacity="0.95">
      <animate attributeName="stroke-dasharray" values="0 1200; 420 780; 0 1200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0; -150; -300" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M 120 120 L 180 120 L 240 180 L 304 160 L 380 120 L 510 180 L 585 110 L 740 200" stroke-width="1.5" opacity="0.7"/>
  </g>

  <g opacity="0.32" mask="url(#scanMaskHero)">
    <rect x="0" y="0" width="1200" height="420" fill="url(#bgGradientHero)"/>
    <rect x="0" y="0" width="1200" height="420" fill="url(#gridHero)"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#F8F0F3">
    <text x="82" y="170" font-size="52" font-weight="700" letter-spacing="4">VAARANAN</text>
    <text x="82" y="232" font-size="52" font-weight="700" letter-spacing="8">J</text>
    <rect x="82" y="248" width="320" height="3" fill="url(#signalGradientHero)" filter="url(#softGlowHero)"/>
    <text x="82" y="294" font-size="22" font-weight="500" fill="#E5B5C7" letter-spacing="1.8">CYBERSECURITY ANALYST • SOC ASPIRANT • BLUE TEAM SECURITY</text>
  </g>

  <g fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" opacity="0.9">
    <rect x="820" y="88" width="150" height="28" rx="14" fill="#451126" stroke="#C77B9B" stroke-opacity="0.5"/>
    <text x="845" y="108" fill="#F8F0F3">SECURITY</text>
    <rect x="900" y="130" width="148" height="28" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity="0.35"/>
    <text x="922" y="150" fill="#E5B5C7">THREAT</text>
    <rect x="840" y="254" width="210" height="30" rx="15" fill="#190B12" stroke="#C77B9B" stroke-opacity="0.35"/>
    <text x="865" y="274" fill="#F8F0F3">BLUE TEAM OPS</text>
  </g>
</svg>
